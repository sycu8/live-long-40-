name: Deploy Cloudflare

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Worker ENVIRONMENT var (staging/production)
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      seed:
        description: Seed remote D1 with educational demo.sql (explicit opt-in)
        required: true
        default: false
        type: boolean
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: deploy-cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Provision & deploy Worker
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_SHARED_SECRET: ${{ secrets.ADMIN_SHARED_SECRET }}
      SESSION_SIGNING_SECRET: ${{ secrets.SESSION_SIGNING_SECRET }}
      INPUT_ENVIRONMENT: ${{ github.event.inputs.environment }}
      INPUT_SEED: ${{ github.event.inputs.seed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Check Cloudflare secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing secret CLOUDFLARE_API_TOKEN. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing secret CLOUDFLARE_ACCOUNT_ID. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "Cloudflare secrets are present."

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve deploy policy
        run: node scripts/deploy-policy.mjs

      - name: Deploy
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$DEPLOY_ENVIRONMENT" != "production" ]; then
            echo "::error::Push deploys must use DEPLOY_ENVIRONMENT=production."
            exit 1
          fi
          if [ "$SEED_REMOTE" = "true" ] || [ "$SEED_REMOTE" = "1" ]; then
            if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
              echo "::error::Remote seeding is only allowed on workflow_dispatch with an explicit seed input."
              exit 1
            fi
          fi
          node scripts/ci-deploy.mjs

  pull-request:
    name: Build and dry-run
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Dry-run Worker deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --dry-run
