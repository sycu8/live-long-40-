name: Deploy Cloudflare

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Worker ENVIRONMENT var (staging/production)
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      seed:
        description: Seed remote D1 with educational demo.sql
        required: true
        default: true
        type: boolean
  push:
    branches:
      - main
      - "cursor/**"

concurrency:
  group: deploy-cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Provision & deploy Worker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_SHARED_SECRET: ${{ secrets.ADMIN_SHARED_SECRET }}
      SESSION_SIGNING_SECRET: ${{ secrets.SESSION_SIGNING_SECRET }}
      DEPLOY_ENVIRONMENT: ${{ github.event.inputs.environment || 'staging' }}
      SEED_REMOTE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.seed || 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Check Cloudflare secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing secret CLOUDFLARE_API_TOKEN. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing secret CLOUDFLARE_ACCOUNT_ID. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "Cloudflare secrets are present."

      - name: Deploy
        run: node scripts/ci-deploy.mjs
