name: Deploy Cloudflare

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Worker ENVIRONMENT var (staging/production)
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      seed:
        description: Seed remote D1 with educational demo.sql
        required: true
        default: false
        type: boolean
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: deploy-cloudflare-${{ github.ref }}
  # A new push or dispatch must not cancel an in-progress production deploy.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: Build & test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Dry-run Worker deploy
        run: pnpm exec wrangler deploy --dry-run

  deploy:
    name: Provision & deploy Worker
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_SHARED_SECRET: ${{ secrets.ADMIN_SHARED_SECRET }}
      SESSION_SIGNING_SECRET: ${{ secrets.SESSION_SIGNING_SECRET }}
      # Push to main is always production and never seeds.
      # Manual runs use the inputs above. github.event.inputs.seed is the
      # string "true"/"false"; accept a real boolean too so false cannot
      # fall through to the old always-seed default.
      DEPLOY_ENVIRONMENT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'production' }}
      SEED_REMOTE: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.seed == 'true' || github.event.inputs.seed == true) && 'true' || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Refuse non-production and non-main deploys
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Production deploys are only allowed from refs/heads/main (got ${GITHUB_REF})."
            exit 1
          fi
          if [ "$DEPLOY_ENVIRONMENT" != "production" ]; then
            echo "::error::Refusing DEPLOY_ENVIRONMENT=${DEPLOY_ENVIRONMENT}. There is no staging Worker; deploying would update the production Worker song-an-40."
            exit 1
          fi

      - name: Check Cloudflare secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing secret CLOUDFLARE_API_TOKEN. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing secret CLOUDFLARE_ACCOUNT_ID. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "Cloudflare secrets are present."

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy
        run: node scripts/ci-deploy.mjs
